---
# Deploy Nginx load balancer on EC2-LB
# Nginx is containerised (same pattern as the rest of the project).
# The upstream config is built dynamically by querying the ASG for running web instance IPs.

- name: Create LB working directories
  file:
    path: "{{ item }}"
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  loop:
    - /home/ubuntu/lb
    - /home/ubuntu/lb/ssl

# ─── TLS certificate (self-signed) ────────────────────────────────────────────
# Used for direct HTTPS access to the LB (port 443).
# CloudFront talks to the LB on HTTP (port 80), so this cert is for direct access only.

- name: Generate OpenSSL private key
  openssl_privatekey:
    path: /home/ubuntu/lb/ssl/server.key
    size: 2048

- name: Generate OpenSSL CSR
  openssl_csr:
    path: /home/ubuntu/lb/ssl/server.csr
    privatekey_path: /home/ubuntu/lb/ssl/server.key
    common_name: "{{ cloudfront_domain }}"

- name: Generate self-signed certificate
  openssl_certificate:
    path: /home/ubuntu/lb/ssl/server.crt
    privatekey_path: /home/ubuntu/lb/ssl/server.key
    csr_path: /home/ubuntu/lb/ssl/server.csr
    provider: selfsigned

# ─── Discover web instance IPs ────────────────────────────────────────────────
# Query AWS for private IPs of currently running web instances in the ASG.
# This runs on the local (control) machine, not on the LB EC2.
# Re-run the playbook after any scaling event to refresh the upstream list.

- name: Ensure cryptography module is installed
  pip:
    name: cryptography
    state: present

- name: Get web instance private IPs from ASG
  shell: >
    aws ec2 describe-instances
    --filters
    "Name=tag:aws:autoscaling:groupName,Values={{ asg_name }}"
    "Name=instance-state-name,Values=running"
    --query "Reservations[].Instances[].PrivateIpAddress"
    --output json
    --region {{ aws_region }}
  register: web_ips_raw
  delegate_to: localhost
  become: no
  changed_when: false

- name: Parse web instance IPs
  set_fact:
    web_instance_ips: "{{ web_ips_raw.stdout | from_json }}"

- name: Fail if no running web instances found
  fail:
    msg: >
      No running web instances found in ASG '{{ asg_name }}'.
      Wait for instances to start (check AWS Console → EC2 → Auto Scaling Groups)
      then re-run: ansible-playbook -i inventory.ini playbook.yml
  when: web_instance_ips | length == 0

- name: Show discovered web instance IPs
  debug:
    msg: "Web instance IPs: {{ web_instance_ips }}"

# ─── Render and deploy config ──────────────────────────────────────────────────

- name: Template Nginx LB configuration
  template:
    src: nginx.lb.conf.j2
    dest: /home/ubuntu/lb/nginx.conf
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Template Docker Compose for LB
  template:
    src: docker-compose.lb.yml.j2
    dest: /home/ubuntu/lb/docker-compose.yml
    owner: ubuntu
    group: ubuntu
    mode: '0644'

- name: Start (or restart) Nginx LB stack
  become_user: ubuntu
  command: docker compose -f /home/ubuntu/lb/docker-compose.yml up -d --force-recreate
  args:
    chdir: /home/ubuntu/lb
