---
# tasks file for inception role

- name: Define domain name variable
  set_fact:
    domain_name: "{{ domain_name | default('mlezcano.42.fr') }}"

- name: Create required directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0755'
  loop:
    - "/home/{{ deploy_user }}/data"
    - "/home/{{ deploy_user }}/data/mariadb"
    - "/home/{{ deploy_user }}/data/wordpress"
    - "/home/{{ deploy_user }}/data/nginx"
    - "/home/{{ deploy_user }}/data/nginx/ssl"
    - "/home/{{ deploy_user }}/inception"

- name: Generate OpenSSL private key for Nginx
  openssl_privatekey:
    path: "/home/{{ deploy_user }}/data/nginx/ssl/server.key"
    size: 2048

- name: Generate OpenSSL CSR for Nginx
  openssl_csr:
    path: "/home/{{ deploy_user }}/data/nginx/ssl/server.csr"
    privatekey_path: "/home/{{ deploy_user }}/data/nginx/ssl/server.key"
    common_name: "{{ domain_name }}"

- name: Generate Self-Signed OpenSSL certificate for Nginx
  openssl_certificate:
    path: "/home/{{ deploy_user }}/data/nginx/ssl/server.crt"
    privatekey_path: "/home/{{ deploy_user }}/data/nginx/ssl/server.key"
    csr_path: "/home/{{ deploy_user }}/data/nginx/ssl/server.csr"
    provider: selfsigned

- name: Template Nginx configuration
  template:
    src: nginx.conf.j2
    dest: "/home/{{ deploy_user }}/data/nginx/nginx.conf"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'

- name: Template docker-compose file
  template:
    src: docker-compose.yml.j2
    dest: "/home/{{ deploy_user }}/inception/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0644'

- name: Copy .env example to target
  copy:
    src: .env.example
    dest: "/home/{{ deploy_user }}/inception/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
    force: no # Do not overwrite if it already exists

- name: Ensure cryptography module is installed
  pip:
    name: cryptography
    state: present

- name: Launch docker-compose stack
  command: docker compose -f /home/{{ deploy_user }}/inception/docker-compose.yml up -d
  args:
    chdir: "/home/{{ deploy_user }}/inception"

- name: Wait for WordPress to initialize wp-config.php (up to 30s)
  wait_for:
    path: "/home/{{ deploy_user }}/data/wordpress/wp-config.php"
    state: present
    timeout: 30
  ignore_errors: true

- name: Fix WordPress WP_HOME and WP_SITEURL for dynamic IPs
  blockinfile:
    path: "/home/{{ deploy_user }}/data/wordpress/wp-config.php"
    marker: "// {mark} ANSIBLE MANAGED BLOCK FOR DYNAMIC IP"
    insertbefore: "/* That's all, stop editing!"
    content: |
      define( 'WP_HOME', 'https://' . $_SERVER['HTTP_HOST'] );
      define( 'WP_SITEURL', 'https://' . $_SERVER['HTTP_HOST'] );
  ignore_errors: true
