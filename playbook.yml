---
# Cloud-1 deployment playbook
#
# Architecture:
#   - EC2-DB: MariaDB in Docker (this playbook configures it)
#   - EC2-Web (x2+): WordPress + Nginx + phpMyAdmin — configured via cloud-init at boot
#
# Run: ansible-playbook -i inventory.ini playbook.yml
# Inventory is auto-generated by: cd terraform && terraform apply

- name: Configure database server
  hosts: db
  become: yes

  roles:
    - docker
    - database
