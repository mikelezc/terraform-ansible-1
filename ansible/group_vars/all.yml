---
# Variables injected by Terraform into inventory.ini [all:vars]
# These vars come from inventory.ini (generated by terraform/inventory.tf):

# db_private_ip       — private IP of EC2-DB (web instances connect here)
# efs_dns_name        — EFS DNS name
# cloudfront_domain   — CloudFront domain name (used in wp-config.php)
# s3_config_bucket    — S3 bucket with web config files
# project_name        — project name (used in S3 bucket names)

# Default deploy user for Ubuntu 22.04 AMI
deploy_user: ubuntu
