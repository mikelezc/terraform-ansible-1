---
# Cloud-1 deployment playbook

# Architecture:
#   - EC2-LB:  Nginx load balancer (this playbook discovers ASG web IPs and configures Nginx)
#   - EC2-DB:  MariaDB in Docker (this playbook deploys it)
#   - EC2-Web: WordPress + Nginx + phpMyAdmin — configured via cloud-init at boot

# Run after terraform apply:
#   ansible-playbook -i inventory.ini playbook.yml

# Run only to refresh LB after scaling (terraform apply -var="web_desired=N"):
#   ansible-playbook -i inventory.ini playbook.yml -l lb

- name: Configure load balancer
  hosts: lb
  become: yes

  roles:
    - docker
    - loadbalancer

- name: Configure database server
  hosts: db
  become: yes

  roles:
    - docker
    - database
