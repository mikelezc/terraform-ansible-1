---
# tasks file for installing Docker and docker-compose on EC2 instances

- name: Update apt cache and install Docker (Ubuntu/Debian)
  apt:
    name: 
      - docker.io
      - python3-pip
    state: present
    update_cache: yes
  when: ansible_pkg_mgr == 'apt'

- name: Install Docker and pip (Amazon Linux / RHEL / CentOS)
  dnf:
    name: 
      - docker
      - python3-pip
    state: present
    update_cache: yes
  when: ansible_pkg_mgr == 'dnf' or ansible_pkg_mgr == 'yum'

- name: Ensure Docker service is started and enabled
  service:
    name: docker
    state: started
    enabled: yes

- name: Create docker cli-plugins directory
  file:
    path: /usr/local/lib/docker/cli-plugins
    state: directory
    mode: '0755'

- name: Install docker-compose binary and plugin
  get_url:
    url: "https://github.com/docker/compose/releases/download/v2.24.5/docker-compose-{{ ansible_system | lower }}-{{ ansible_architecture }}"
    dest: /usr/local/bin/docker-compose
    mode: '0755'

- name: Symlink docker-compose to cli-plugins directory
  file:
    src: /usr/local/bin/docker-compose
    dest: /usr/local/lib/docker/cli-plugins/docker-compose
    state: link
    mode: 'a+x'
    force: false

- name: Install pip module for Python interaction (Amazon Linux)
  pip:
    name: docker
    state: present
    extra_args: "--ignore-installed"
  when: ansible_pkg_mgr == 'dnf' or ansible_pkg_mgr == 'yum'

- name: Install pip module for Python interaction (Ubuntu/Debian)
  apt:
    name: python3-docker
    state: present
  when: ansible_pkg_mgr == 'apt'

